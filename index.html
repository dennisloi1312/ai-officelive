<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; img-src 'self'; font-src 'none'; style-src 'self'; connect-src https://ntfy.sh; script-src 'self' https://cdn.jsdelivr.net 'sha256-/neONZNSzp6tDn0DeJDcFsXd9UFJ1+WL9YDmzBCOsTE='">
  <title>AI Office</title>
  <meta name="description" content="A live isometric office where your AI assistant bots work, one floor at a time.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/office.css">
</head>
<body>
  <p class="sr-only" id="app-desc">Isometric office. Choose a floor, then a bot. Drag to orbit, scroll or pinch to zoom. Times use this device’s clock.</p>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <div id="stage" class="stage">
    <div class="vignette" aria-hidden="true"></div>
    <p id="fatal" class="fatal" hidden>This browser could not start the 3D view.</p>
  </div>
  <header class="top">
    <div class="pill brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="brand-copy">
        <h1>AI Office</h1>
        <p id="conn" class="conn demo" role="status">Demo</p>
      </div>
      <time id="clock" datetime="">--:--</time>
      <button id="sound-btn" type="button" aria-pressed="false" aria-label="Turn sound on">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M4 9h3.2L12 5.2v13.6L7.2 15H4V9z"/>
          <path class="sound-wave" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 7a7 7 0 0 1 0 10"/>
          <path class="sound-off" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 10l5 5M21 10l-5 5"/>
        </svg>
      </button>
    </div>
    <div id="summary" class="pill summary" aria-label="Status summary"></div>
  </header>
  <nav id="floor-tabs" class="floor-tabs" aria-label="Floors"></nav>
  <p id="banner" class="banner" hidden></p>
  <div id="drawer" class="drawer">
    <button id="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-body" aria-label="Panels"><span class="grabber" aria-hidden="true"></span></button>
    <div id="usage-dock"></div>
    <div id="drawer-body" class="drawer-body">
      <div id="left"></div>
      <div id="right"></div>
      <div id="activity"></div>
    </div>
  </div>
  <div class="zoom pill" role="group" aria-label="Zoom">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  </div>
  <button id="backdrop" class="backdrop" type="button" hidden aria-label="Close details"></button>
  <article id="bot-card" class="bot-card" hidden></article>
  <noscript><p class="noscript">JavaScript is required to show the office.</p></noscript>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
